name: Develop Lint
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx htmlhint public/*.html
      - run: npx stylelint public/css/*.css